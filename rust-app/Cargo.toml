[package]
name = "food4u-rust-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
topcoat = { version = "=0.9.0", default-features = false, features = ["router", "view", "runtime", "asset", "discover", "cookie"] }
topcoat-cloudflare = "=0.2.0"
worker = { version = "=0.8.7", features = ["http", "d1"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bcrypt = { version = "=0.19.3", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
js-sys = "0.3"
serde_urlencoded = "0.7"
