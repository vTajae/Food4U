[package]
name = "food4u-rust-spike"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
topcoat = { version = "=0.9.0", default-features = false, features = ["router", "view", "runtime", "asset", "discover"] }
topcoat-cloudflare = "=0.2.0"
worker = { version = "=0.8.7", features = ["http"] }
wasm-bindgen = "0.2"
